<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#07141a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#f2c230" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#14c4c4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#14c4c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#14c4c4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14c4c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14c4c4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- App window -->
  <rect x="60" y="50" width="1080" height="530" rx="26" fill="#0f1726" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="96" cy="84" r="6" fill="#ff5f57"/>
  <circle cx="116" cy="84" r="6" fill="#febc2e"/>
  <circle cx="136" cy="84" r="6" fill="#28c840"/>
  <text x="600" y="89" text-anchor="middle" font-size="14" fill="#94a3b8">Diabetes Prediction · Dashboard</text>
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Header -->
  <g transform="translate(96 150)">
    <rect width="44" height="44" rx="12" fill="url(#brand)"/>
    <!-- droplet icon -->
    <path d="M22 9 C22 9 12 21 12 27 a10 10 0 0 0 20 0 C32 21 22 9 22 9 Z" fill="#0b1220"/>
    <text x="60" y="19" font-size="22" font-weight="700" fill="#f8fafc">Diabetes Risk Prediction</text>
    <text x="60" y="40" font-size="14" fill="#94a3b8">Machine-learning health assessment</text>
  </g>
  <g transform="translate(900 152)">
    <rect width="204" height="38" rx="19" fill="#14c4c4" fill-opacity="0.12" stroke="#14c4c4" stroke-opacity="0.4"/>
    <circle cx="22" cy="19" r="5" fill="#34d399"/>
    <text x="36" y="24" font-size="14" font-weight="600" fill="#5eead4">Analysis complete</text>
  </g>

  <!-- Left: patient inputs -->
  <g transform="translate(96 222)">
    <rect width="330" height="322" rx="20" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#f8fafc">Patient metrics</text>

    <g font-size="13" fill="#94a3b8">
      <text x="24" y="80">Glucose</text>
      <text x="306" y="80" text-anchor="end" fill="#e2e8f0" font-weight="600">148 mg/dL</text>
      <rect x="24" y="90" width="282" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="24" y="90" width="196" height="8" rx="4" fill="url(#brand)"/>

      <text x="24" y="136">BMI</text>
      <text x="306" y="136" text-anchor="end" fill="#e2e8f0" font-weight="600">27.4</text>
      <rect x="24" y="146" width="282" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="24" y="146" width="150" height="8" rx="4" fill="url(#brand)"/>

      <text x="24" y="192">Blood pressure</text>
      <text x="306" y="192" text-anchor="end" fill="#e2e8f0" font-weight="600">72 mmHg</text>
      <rect x="24" y="202" width="282" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="24" y="202" width="120" height="8" rx="4" fill="url(#brand)"/>

      <text x="24" y="248">Age</text>
      <text x="306" y="248" text-anchor="end" fill="#e2e8f0" font-weight="600">45</text>
      <rect x="24" y="258" width="282" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
      <rect x="24" y="258" width="170" height="8" rx="4" fill="url(#brand)"/>
    </g>
    <rect x="24" y="284" width="282" height="22" rx="11" fill="none"/>
  </g>

  <!-- Middle: risk gauge -->
  <g transform="translate(446 222)">
    <rect width="300" height="322" rx="20" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#f8fafc">Predicted risk</text>
    <!-- gauge track: semicircle r=100 centered (150,200) -->
    <path d="M50 200 A100 100 0 0 1 250 200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18" stroke-linecap="round"/>
    <!-- gauge value ~ 62% -->
    <path d="M50 200 A100 100 0 0 1 187.5 107.3" fill="none" stroke="url(#brand)" stroke-width="18" stroke-linecap="round"/>
    <text x="150" y="190" text-anchor="middle" font-size="46" font-weight="700" fill="#f8fafc">62%</text>
    <text x="150" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">Moderate risk</text>
    <g transform="translate(24 252)">
      <rect width="252" height="46" rx="12" fill="#f2c230" fill-opacity="0.1" stroke="#f2c230" stroke-opacity="0.35"/>
      <text x="126" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#fcd34d">Recommend follow-up screening</text>
    </g>
  </g>

  <!-- Right: glucose trend -->
  <g transform="translate(766 222)">
    <rect width="338" height="322" rx="20" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#f8fafc">Glucose trend</text>
    <text x="24" y="58" font-size="12" fill="#94a3b8">Last 7 readings</text>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="24" y1="110" x2="314" y2="110"/>
      <line x1="24" y1="160" x2="314" y2="160"/>
      <line x1="24" y1="210" x2="314" y2="210"/>
      <line x1="24" y1="260" x2="314" y2="260"/>
    </g>
    <path d="M24 220 L72 196 L120 208 L168 160 L216 172 L264 128 L314 140 L314 280 L24 280 Z" fill="url(#area)"/>
    <path d="M24 220 L72 196 L120 208 L168 160 L216 172 L264 128 L314 140" fill="none" stroke="#14c4c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#0f1726" stroke="#14c4c4" stroke-width="3">
      <circle cx="72" cy="196" r="5"/>
      <circle cx="168" cy="160" r="5"/>
      <circle cx="264" cy="128" r="6" fill="#14c4c4"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="24" y="300">Mon</text>
      <text x="120" y="300">Wed</text>
      <text x="216" y="300">Fri</text>
      <text x="314" y="300">Sun</text>
    </g>
  </g>
</svg>
