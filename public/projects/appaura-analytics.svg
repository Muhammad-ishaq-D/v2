<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#07141a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#f2c230" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#14c4c4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#14c4c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#14c4c4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14c4c4"/>
      <stop offset="1" stop-color="#14c4c4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#f2c230" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="300" height="170" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- App window -->
  <rect x="60" y="50" width="1080" height="530" rx="26" fill="#0f1726" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Sidebar -->
  <rect x="60" y="50" width="96" height="530" rx="26" fill="#0c1422"/>
  <rect x="130" y="50" width="26" height="530" fill="#0c1422"/>
  <line x1="156" y1="50" x2="156" y2="580" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="86" y="80" width="44" height="44" rx="12" fill="url(#brand)"/>
  <text x="108" y="109" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">A</text>
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="94" y="162" width="28" height="28" rx="8" fill="#14c4c4" fill-opacity="0.25"/>
    <rect x="94" y="214" width="28" height="28" rx="8"/>
    <rect x="94" y="266" width="28" height="28" rx="8"/>
    <rect x="94" y="318" width="28" height="28" rx="8"/>
  </g>
  <rect x="100" y="168" width="16" height="16" rx="3" fill="none" stroke="#5eead4" stroke-width="2"/>

  <!-- Header -->
  <text x="190" y="104" font-size="24" font-weight="700" fill="#f8fafc">Financial Overview</text>
  <text x="190" y="128" font-size="14" fill="#94a3b8">Appaura Analytics Dashboard</text>
  <g transform="translate(930 84)">
    <rect width="174" height="40" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="87" y="25" text-anchor="middle" font-size="13" fill="#cbd5e1">This month  ▾</text>
  </g>

  <!-- Balance card -->
  <g transform="translate(190 160)">
    <rect width="300" height="170" rx="20" fill="url(#brand)"/>
    <rect width="300" height="170" rx="20" fill="#0b1220" fill-opacity="0.18"/>
    <g clip-path="url(#cardClip)">
      <circle cx="262" cy="36" r="60" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="290" cy="150" r="70" fill="#ffffff" fill-opacity="0.06"/>
    </g>
    <text x="24" y="40" font-size="14" font-weight="600" fill="#0b1220" fill-opacity="0.75">Total balance</text>
    <text x="24" y="88" font-size="38" font-weight="800" fill="#0b1220">$48,295.60</text>
    <g transform="translate(24 116)">
      <rect width="92" height="28" rx="14" fill="#0b1220" fill-opacity="0.2"/>
      <text x="46" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">▲ 12.4%</text>
    </g>
    <text x="276" y="142" text-anchor="end" font-size="13" font-weight="600" fill="#0b1220" fill-opacity="0.7">•••• 4821</text>
  </g>

  <!-- Income / Expense mini stats -->
  <g transform="translate(190 346)">
    <rect width="142" height="92" rx="16" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="18" y="32" font-size="12" fill="#94a3b8">Income</text>
    <text x="18" y="62" font-size="22" font-weight="700" fill="#5eead4">+$12.8k</text>
  </g>
  <g transform="translate(348 346)">
    <rect width="142" height="92" rx="16" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="18" y="32" font-size="12" fill="#94a3b8">Expenses</text>
    <text x="18" y="62" font-size="22" font-weight="700" fill="#fcd34d">−$7.3k</text>
  </g>
  <g transform="translate(190 454)">
    <rect width="300" height="92" rx="16" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="18" y="32" font-size="12" fill="#94a3b8">Savings goal</text>
    <text x="282" y="32" text-anchor="end" font-size="12" font-weight="600" fill="#e2e8f0">68%</text>
    <rect x="18" y="50" width="264" height="10" rx="5" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="18" y="50" width="180" height="10" rx="5" fill="url(#brand)"/>
  </g>

  <!-- Cash-flow chart -->
  <g transform="translate(510 160)">
    <rect width="340" height="386" rx="20" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="38" font-size="16" font-weight="700" fill="#f8fafc">Cash flow</text>
    <text x="24" y="58" font-size="12" fill="#94a3b8">Monthly revenue</text>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="24" y1="110" x2="316" y2="110"/>
      <line x1="24" y1="180" x2="316" y2="180"/>
      <line x1="24" y1="250" x2="316" y2="250"/>
      <line x1="24" y1="320" x2="316" y2="320"/>
    </g>
    <g>
      <rect x="34" y="230" width="26" height="90" rx="7" fill="url(#bar)"/>
      <rect x="80" y="190" width="26" height="130" rx="7" fill="url(#bar)"/>
      <rect x="126" y="210" width="26" height="110" rx="7" fill="url(#bar)"/>
      <rect x="172" y="150" width="26" height="170" rx="7" fill="url(#bar)"/>
      <rect x="218" y="170" width="26" height="150" rx="7" fill="url(#bar)"/>
      <rect x="264" y="118" width="26" height="202" rx="7" fill="url(#barHi)"/>
    </g>
    <g transform="translate(236 78)">
      <rect width="84" height="28" rx="8" fill="#f2c230"/>
      <text x="42" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220">$9,420</text>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="47" y="346">Jan</text>
      <text x="93" y="346">Feb</text>
      <text x="139" y="346">Mar</text>
      <text x="185" y="346">Apr</text>
      <text x="231" y="346">May</text>
      <text x="277" y="346">Jun</text>
    </g>
  </g>

  <!-- Transactions -->
  <g transform="translate(870 160)">
    <rect width="234" height="386" rx="20" fill="#131d2f" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="20" y="38" font-size="16" font-weight="700" fill="#f8fafc">Transactions</text>

    <g transform="translate(20 66)">
      <rect width="36" height="36" rx="10" fill="#14c4c4" fill-opacity="0.15"/>
      <text x="18" y="24" text-anchor="middle" font-size="15" fill="#5eead4">↓</text>
      <text x="48" y="15" font-size="13" font-weight="600" fill="#e2e8f0">Client payment</text>
      <text x="48" y="32" font-size="11" fill="#64748b">Today</text>
      <text x="194" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#5eead4">+$2,400</text>
    </g>
    <g transform="translate(20 124)">
      <rect width="36" height="36" rx="10" fill="#f2c230" fill-opacity="0.15"/>
      <text x="18" y="24" text-anchor="middle" font-size="15" fill="#fcd34d">↑</text>
      <text x="48" y="15" font-size="13" font-weight="600" fill="#e2e8f0">Cloud hosting</text>
      <text x="48" y="32" font-size="11" fill="#64748b">Yesterday</text>
      <text x="194" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#fcd34d">−$180</text>
    </g>
    <g transform="translate(20 182)">
      <rect width="36" height="36" rx="10" fill="#14c4c4" fill-opacity="0.15"/>
      <text x="18" y="24" text-anchor="middle" font-size="15" fill="#5eead4">↓</text>
      <text x="48" y="15" font-size="13" font-weight="600" fill="#e2e8f0">Subscription</text>
      <text x="48" y="32" font-size="11" fill="#64748b">Jun 12</text>
      <text x="194" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#5eead4">+$960</text>
    </g>
    <g transform="translate(20 240)">
      <rect width="36" height="36" rx="10" fill="#f2c230" fill-opacity="0.15"/>
      <text x="18" y="24" text-anchor="middle" font-size="15" fill="#fcd34d">↑</text>
      <text x="48" y="15" font-size="13" font-weight="600" fill="#e2e8f0">Office supplies</text>
      <text x="48" y="32" font-size="11" fill="#64748b">Jun 10</text>
      <text x="194" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#fcd34d">−$74</text>
    </g>
    <g transform="translate(20 298)">
      <rect width="36" height="36" rx="10" fill="#14c4c4" fill-opacity="0.15"/>
      <text x="18" y="24" text-anchor="middle" font-size="15" fill="#5eead4">↓</text>
      <text x="48" y="15" font-size="13" font-weight="600" fill="#e2e8f0">Refund</text>
      <text x="48" y="32" font-size="11" fill="#64748b">Jun 08</text>
      <text x="194" y="22" text-anchor="end" font-size="13" font-weight="700" fill="#5eead4">+$45</text>
    </g>
  </g>
</svg>
